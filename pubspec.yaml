name: devops_quiz
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.8.1+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  new_version_plus: ^1.0.1
  flutter_svg: ^2.2.1
  path_drawing: ^1.0.1
  pdf: ^3.11.3
  printing: ^5.14.2
  scratcher: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  
flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/devops_logo.png
    - assets/icon/app_icon.png
    - assets/questions/
    - assets/questions_en.json
    - assets/questions_hi.json
    - assets/questions_mr.json
    - assets/questions/Linux/
    - assets/questions/AWS/
    - assets/questions/Docker/
    - assets/questions/K8s/
    - assets/questions/Terraform/
    - assets/questions/Azure/
    - assets/questions/Ansible/
    - assets/questions/Git/
    - assets/questions/Jenkins/
    - assets/questions/Hybridcloud/
    - assets/questions/IBM/
    - assets/questions/Jenkins/
    - assets/questions/Multicloud/
    - assets/questions/Networking/
    - assets/questions/Oracle/
    - assets/questions/GCP/
    